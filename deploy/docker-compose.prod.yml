services:
  monitor:
    build:
      context: ..
      dockerfile: Dockerfile
    image: media-monitor:latest
    container_name: media-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../realtime/data:/app/realtime/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
