# 内容数据监控台 反向代理配置
# 放到 /etc/nginx/conf.d/media-monitor.conf，改掉域名后 nginx -t && systemctl reload nginx
# 证书用 certbot 申请： certbot --nginx -d monitor.example.com

server {
    listen 80;
    server_name monitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name monitor.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 公网暴露时建议开一层口令（先执行： htpasswd -c /etc/nginx/.htpasswd_monitor 你的用户名）
    # auth_basic "media monitor";
    # auth_basic_user_file /etc/nginx/.htpasswd_monitor;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 实时推送（SSE）必须关闭缓冲，否则页面不会实时刷新
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 如果想挂到子路径（例如 https://example.com/monitor/），用下面这段替代上面的 location /
    # location /monitor/ {
    #     proxy_pass http://127.0.0.1:8787/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     proxy_read_timeout 3600s;
    # }
}
